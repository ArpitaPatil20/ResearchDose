<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-opacity="0.35"/>

  <!-- Glowing Accent Circle -->
  <circle cx="256" cy="240" r="160" fill="url(#primaryGrad)" opacity="0.12" filter="url(#glow)"/>

  <!-- Flask / Caduceus / Scientific Prescription Symbol -->
  <g transform="translate(106, 80)">
    <!-- Flask Body Outer Glow -->
    <path d="M 120 40 L 180 40 L 180 110 L 270 260 C 290 295 265 340 220 340 L 80 340 C 35 340 10 295 30 260 L 120 110 Z" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Liquid Level with Gradient -->
    <path d="M 58 280 C 100 260 160 300 242 275 C 248 288 250 300 242 315 C 235 328 220 334 205 334 L 95 334 C 75 334 62 324 56 310 Z" 
          fill="url(#accentGrad)" opacity="0.85"/>

    <!-- Flask Neck Lip -->
    <line x1="102" y1="40" x2="198" y2="40" stroke="url(#primaryGrad)" stroke-width="22" stroke-linecap="round"/>

    <!-- Measurement Graduation Marks -->
    <line x1="130" y1="170" x2="160" y2="170" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <line x1="115" y1="210" x2="155" y2="210" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <line x1="100" y1="250" x2="150" y2="250" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

    <!-- Small Rising Bubbles -->
    <circle cx="120" cy="290" r="9" fill="#ffffff" opacity="0.75"/>
    <circle cx="160" cy="275" r="14" fill="#ffffff" opacity="0.85"/>
    <circle cx="185" cy="240" r="7" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Rx / Scientific Badge Overlay -->
  <g transform="translate(300, 290)">
    <circle cx="70" cy="70" r="58" fill="#0d6efd" filter="url(#glow)"/>
    <circle cx="70" cy="70" r="54" fill="#0a0f1d" stroke="#38bdf8" stroke-width="4"/>
    <!-- Rx Symbol -->
    <text x="70" y="86" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="46" fill="#38bdf8" text-anchor="middle">Rx</text>
  </g>
</svg>
